services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: funds_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Batman751995!@#
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong(!)Password -Q 'SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - funds_network

  funds-api:
    build:
      context: ./services/funds-api
      dockerfile: Dockerfile
    container_name: funds_api_service
    environment:
      - ConnectionStrings__DefaultConnection=Server=sql-server,1433;Database=WalletFundsDB;User Id=sa;Password=YourStrong(!)Password;TrustServerCertificate=true;
      - RiskService__BaseUrl=http://risk-service:8000
    ports:
      - "5000:80"
    depends_on:
      sql-server:
        condition: service_healthy
    networks:
      - funds_network

  risk-service:
    build:
      context: ./services/risk-service
      dockerfile: Dockerfile
    container_name: risk_evaluation_service
    ports:
      - "8000:8000"
    networks:
      - funds_network

  control-dashboard:
    build:
      context: ./services/control-dashboard
      dockerfile: Dockerfile
    container_name: control_dashboard_ui
    ports:
      - "4200:80"
    depends_on:
      - funds-api
    networks:
      - funds_network

networks:
  funds_network:
    driver: bridge

volumes:
  sqlserver_data: